name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ssheven
        run: ./build-ssheven-docker.bash

      - name: Verify build output
        run: test -s build-fat/ssheven-fat.bin
